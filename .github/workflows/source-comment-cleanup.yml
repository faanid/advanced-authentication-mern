name: Source comment cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  strip-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Remove source comments
        run: node scripts/strip-source-comments.js

      - name: Verify no source comments remain
        run: node scripts/strip-source-comments.js --check

      - name: Check backend JavaScript syntax
        run: find backend -path backend/node_modules -prune -o -type f -name "*.js" -print0 | xargs -0 -n 1 node --check

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend
        working-directory: frontend
        env:
          CI: true
          REACT_APP_BACKEND_URL: https://example.invalid
          REACT_APP_GOOGLE_CLIENT_ID: test-client-id
        run: npm run build

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit cleaned source files when needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend frontend scripts
            git commit -m "chore: remove comments from source files"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
