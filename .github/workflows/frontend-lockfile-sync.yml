name: Frontend lockfile sync

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean frontend install
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend
        working-directory: frontend
        env:
          CI: true
          REACT_APP_BACKEND_URL: https://example.invalid
          REACT_APP_GOOGLE_CLIENT_ID: test-client-id
        run: npm run build

      - name: Commit updated lockfile when needed
        run: |
          if ! git diff --quiet -- frontend/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/package-lock.json
            git commit -m "chore(frontend): regenerate lockfile for Dart Sass"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
