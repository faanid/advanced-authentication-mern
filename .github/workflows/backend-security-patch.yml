name: Backend dependency security patch

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/package.json"
      - "backend/package-lock.json"

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Apply compatible security updates
        working-directory: backend
        run: npm audit fix --package-lock-only

      - name: Verify clean installation
        working-directory: backend
        run: npm ci

      - name: Verify no high or critical vulnerabilities remain
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Commit patched lockfile when needed
        run: |
          if ! git diff --quiet -- backend/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/package-lock.json
            git commit -m "security(deps): patch vulnerable backend packages"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
