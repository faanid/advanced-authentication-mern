name: Frontend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --json > npm-audit.json || true

      - name: Summarize frontend dependency audit
        working-directory: frontend
        run: |
          node - <<'NODE'
          const report = require("./npm-audit.json");
          const counts = report.metadata?.vulnerabilities || {};
          process.stdout.write(`Vulnerability totals: ${JSON.stringify(counts)}\n`);
          for (const [name, vulnerability] of Object.entries(report.vulnerabilities || {})) {
            process.stdout.write([
              name,
              vulnerability.severity,
              vulnerability.range,
              JSON.stringify(vulnerability.fixAvailable),
            ].join("\t") + "\n");
          }
          NODE

      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
        run: npm test

      - name: Build frontend
        working-directory: frontend
        env:
          CI: true
          VITE_BACKEND_URL: https://example.invalid
          VITE_GOOGLE_CLIENT_ID: test-client-id
        run: npm run build

