name: Frontend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and safely update the frontend lockfile
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --json > npm-audit.json || true

      - name: Summarize frontend dependency audit
        working-directory: frontend
        run: |
          node - <<'NODE'
          const report = require("./npm-audit.json");
          const counts = report.metadata?.vulnerabilities || {};
          process.stdout.write(`Vulnerability totals: ${JSON.stringify(counts)}\n`);
          for (const [name, vulnerability] of Object.entries(report.vulnerabilities || {})) {
            process.stdout.write([
              name,
              vulnerability.severity,
              vulnerability.range,
              JSON.stringify(vulnerability.fixAvailable),
            ].join("\t") + "\n");
          }
          NODE

      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
        run: npm test

      - name: Build frontend
        working-directory: frontend
        env:
          CI: true
          VITE_BACKEND_URL: https://example.invalid
          VITE_GOOGLE_CLIENT_ID: test-client-id
        run: npm run build

      - name: Commit refreshed frontend lockfile
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -f frontend/package-lock.json ]; then
            git add frontend/package-lock.json
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "chore(frontend): refresh dependency lockfile"
              git push origin "HEAD:${HEAD_REF}"
            fi
          fi
