name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/advanced_auth_test
      JWT_SECRET: integration-test-secret-with-sufficient-entropy
      FRONTEND_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Summarize backend dependency audit
        working-directory: backend
        run: |
          npm audit --json > audit-report.json || true
          node -e 'const report = require("./audit-report.json"); for (const [name, issue] of Object.entries(report.vulnerabilities || {})) console.log(JSON.stringify({ name, severity: issue.severity, direct: issue.isDirect, range: issue.range, fixAvailable: issue.fixAvailable, via: issue.via.map(item => typeof item === "string" ? item : item.title) }));'

      - name: Enforce dependency audit
        working-directory: backend
        run: npm audit

      - name: Check JavaScript syntax
        run: find backend -path backend/node_modules -prune -o -type f -name "*.js" -print0 | xargs -0 -n 1 node --check

      - name: Run available backend tests
        working-directory: backend
        run: npm test --if-present
